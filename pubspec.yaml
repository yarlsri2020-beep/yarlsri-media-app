name: yarlsri_media
description: YARLSRI MEDIA News App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  video_player: ^2.9.5
  just_audio: ^0.9.46
  http: ^1.3.0
  app_links: ^6.4.1
  shared_preferences: ^2.3.2
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.15
  flutter_vlc_player: ^7.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/yarlsri_logo.jpg
    - assets/images/yarlsri_fm_logo.jpg
