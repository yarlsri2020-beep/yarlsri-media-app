
name: Build YARLSRI MEDIA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name yarlsri_media --org com.yarlsrimedia .

      - name: Configure Android Internet, App Links and Background Radio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")

          android_ns = "http://schemas.android.com/apk/res/android"
          tools_ns = "http://schemas.android.com/tools"

          ET.register_namespace("android", android_ns)
          ET.register_namespace("tools", tools_ns)

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          def a(name):
              return f"{{{android_ns}}}{name}"

          existing_permissions = {
              item.get(a("name"))
              for item in root.findall("uses-permission")
          }

          required_permissions = [
              "android.permission.INTERNET",
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
          ]

          for permission in required_permissions:
              if permission not in existing_permissions:
                  ET.SubElement(
                      root,
                      "uses-permission",
                      {a("name"): permission},
                  )

          application = root.find("application")
          if application is None:
              raise RuntimeError("Android application not found")

          activity = None
          for item in application.findall("activity"):
              name = item.get(a("name"), "")
              if name.endswith("MainActivity") or name.endswith("AudioServiceActivity"):
                  activity = item
                  break

          if activity is None:
              raise RuntimeError("MainActivity not found")

          activity.set(
              a("name"),
              "com.ryanheise.audioservice.AudioServiceActivity",
          )
          activity.set(a("exported"), "true")

          # Preserve WhatsApp / website news deep links.
          has_news_link = False

          for intent in activity.findall("intent-filter"):
              for data in intent.findall("data"):
                  if (
                      data.get(a("host")) == "yarlsrimedia.com"
                      and data.get(a("path")) == "/news_details.php"
                  ):
                      has_news_link = True

          if not has_news_link:
              intent = ET.SubElement(
                  activity,
                  "intent-filter",
                  {a("autoVerify"): "true"},
              )

              ET.SubElement(
                  intent,
                  "action",
                  {a("name"): "android.intent.action.VIEW"},
              )

              for category in [
                  "android.intent.category.DEFAULT",
                  "android.intent.category.BROWSABLE",
              ]:
                  ET.SubElement(
                      intent,
                      "category",
                      {a("name"): category},
                  )

              ET.SubElement(
                  intent,
                  "data",
                  {
                      a("scheme"): "https",
                      a("host"): "yarlsrimedia.com",
                      a("path"): "/news_details.php",
                  },
              )

          service_name = "com.ryanheise.audioservice.AudioService"

          if not any(
              item.get(a("name")) == service_name
              for item in application.findall("service")
          ):
              service = ET.SubElement(
                  application,
                  "service",
                  {
                      a("name"): service_name,
                      a("foregroundServiceType"): "mediaPlayback",
                      a("exported"): "true",
                      f"{{{tools_ns}}}ignore": "Instantiatable",
                  },
              )

              intent = ET.SubElement(service, "intent-filter")
              ET.SubElement(
                  intent,
                  "action",
                  {a("name"): "android.media.browse.MediaBrowserService"},
              )

          receiver_name = "com.ryanheise.audioservice.MediaButtonReceiver"

          if not any(
              item.get(a("name")) == receiver_name
              for item in application.findall("receiver")
          ):
              receiver = ET.SubElement(
                  application,
                  "receiver",
                  {
                      a("name"): receiver_name,
                      a("exported"): "true",
                      f"{{{tools_ns}}}ignore": "Instantiatable",
                  },
              )

              intent = ET.SubElement(receiver, "intent-filter")
              ET.SubElement(
                  intent,
                  "action",
                  {a("name"): "android.intent.action.MEDIA_BUTTON"},
              )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True,
          )

          print("Android background radio configuration completed.")
          PY

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/yarlsri-release.jks
          test -s android/app/yarlsri-release.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise RuntimeError("Flutter Kotlin Gradle file not found")

          text = gradle.read_text()

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          signing_setup = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

          text = text.replace(
              "android {",
              signing_setup + "android {",
              1
          )

          signing_config = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(
                          keystoreProperties["storeFile"] as String
                      )
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """

          text = text.replace(
              "    buildTypes {",
              signing_config + "    buildTypes {",
              1
          )

          text = text.replace(
              "signingConfig = signingConfigs.getByName(\"debug\")",
              "signingConfig = signingConfigs.getByName(\"release\")"
          )

          gradle.write_text(text)
          PY

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=yarlsri-release.jks
          EOF

      - name: Install packages
        run: flutter pub get

      - name: Build signed Android APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

      - name: Show signing certificate SHA-256
        run: |
          keytool -list -v \
            -keystore android/app/yarlsri-release.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep "SHA256:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YARLSRI-MEDIA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
