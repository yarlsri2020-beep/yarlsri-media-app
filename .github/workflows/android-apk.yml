

name: Build YARLSRI MEDIA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name yarlsri_media --org com.yarlsrimedia .

      - name: Enable Internet permission and Android App Links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          text = text.replace(
              "<application",
              '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
              1
          )

          app_link_filter = """
                  <intent-filter android:autoVerify="true">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data
                          android:scheme="https"
                          android:host="yarlsrimedia.com"
                          android:path="/news_details.php" />
                  </intent-filter>
          """

          marker = '<meta-data\n                android:name="flutterEmbedding"'

          if marker in text:
              text = text.replace(
                  marker,
                  app_link_filter + "\n            " + marker,
                  1
              )
          else:
              raise RuntimeError("Flutter AndroidManifest.xml format changed")

          manifest.write_text(text)
          PY

      - name: Install packages
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YARLSRI-MEDIA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
