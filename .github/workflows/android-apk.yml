          activity.set(a('name'), 'com.ryanheise.audioservice.AudioServiceActivity')
          activity.set(a('exported'), 'true')

          has_news_link = any(
              data.get(a('host')) == 'yarlsrimedia.com'
              and data.get(a('path')) == '/news_details.php'
              for intent in activity.findall('intent-filter')
              for data in intent.findall('data')
          )
          if not has_news_link:
              intent = ET.SubElement(activity, 'intent-filter', {a('autoVerify'): 'true'})
              ET.SubElement(intent, 'action', {a('name'): 'android.intent.action.VIEW'})
              for category in ['android.intent.category.DEFAULT', 'android.intent.category.BROWSABLE']:
                  ET.SubElement(intent, 'category', {a('name'): category})
