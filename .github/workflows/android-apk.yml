
name: Build YARLSRI MEDIA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name yarlsri_media --org com.yarlsrimedia .

      - name: Enable Internet and Android App Links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          android_name = f"{{{android_ns}}}name"

          permissions = [
              element.get(android_name)
              for element in root.findall("uses-permission")
          ]

          if "android.permission.INTERNET" not in permissions:
              ET.SubElement(
                  root,
                  "uses-permission",
                  {android_name: "android.permission.INTERNET"},
              )

          application = root.find("application")

          if application is None:
              raise RuntimeError("Android application not found")

          activity = None

          for item in application.findall("activity"):
              name = item.get(android_name, "")
              if name.endswith("MainActivity"):
                  activity = item
                  break

          if activity is None:
              raise RuntimeError("MainActivity not found")

          intent_filter = ET.SubElement(
              activity,
              "intent-filter",
              {
                  f"{{{android_ns}}}autoVerify": "true",
              },
          )

          ET.SubElement(
              intent_filter,
              "action",
              {
                  android_name:
                      "android.intent.action.VIEW",
              },
          )

          for category in [
              "android.intent.category.DEFAULT",
              "android.intent.category.BROWSABLE",
          ]:
              ET.SubElement(
                  intent_filter,
                  "category",
                  {android_name: category},
              )

          ET.SubElement(
              intent_filter,
              "data",
              {
                  f"{{{android_ns}}}scheme": "https",
                  f"{{{android_ns}}}host":
                      "yarlsrimedia.com",
                  f"{{{android_ns}}}path":
                      "/news_details.php",
              },
          )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True,
          )

          print("Internet permission added")
          print("Android App Links added")
          PY

      - name: Install packages
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YARLSRI-MEDIA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
